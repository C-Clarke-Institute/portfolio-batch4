<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar container">
            <a href="#home" class="navbar-brand">
                <span class="brand-icon">A</span>
                <span>Alex</span>
            </a>
            <div class="navbar-links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </div>
            <a href="#contact" class="navbar-button">Get in Touch</a>
        </nav>

    </header>

    <main>
        <section class="hero" id="home">
            <div class="hero-layout container">
                <div class="hero-content">

                    <p class="status-pill">
                        <span></span>
                        Available for Software Engineering Leaderships
                    </p>
                    <h1 class="hero-title">
                        Hi, I'm Alex. <br>
                        <span>Full Stack Developer.</span>
                    </h1>
                    <p class="hero-description">
                        I build clean, practical web applications and enjoy
                    </p>

                    <div class="hero-actions">
                        <a href="#projects" class="button button-primary">View My Projects</a>
                        <a href="#contacts" class="button button-secondary"> Contact Me</a>
                    
                    </div>

                    <div class="hero-meta">
                        <span>Colombo, SriLanka</span>
                        <span>Open to Remote & Hybrid</span>
                    </div>
                </div>

                <article class="terminal-card"></article>
            </div>
        </section>






        <section class="about" id="about"></section>
        <section class="skills" id="skills"></section>
        <section class="projects" id="projects"></section>
        <section class="contact" id="contact"></section>

    </main>
    <footer class="footer"></footer>
    
</body>
</html>
